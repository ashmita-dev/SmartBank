# Oracle stops an Always Free Autonomous Database after 7 days without
# activity (and may delete it after 90 days stopped). This sends one HTTPS
# request to the public, read-only GET /health endpoint every 3 days, which
# counts as activity and also records whether the live API is healthy.
#
# Uses the repository variable SMARTBANK_API_URL; does nothing until it is set.
# Note: GitHub pauses scheduled workflows in repositories with no activity
# for 60 days; re-enable it from the Actions tab if that happens.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        env:
          API_URL: ${{ vars.SMARTBANK_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "SMARTBANK_API_URL is not set; nothing to do."; exit 0
          fi
          code=$(curl -s -o health.json -w '%{http_code}' --max-time 60 "${API_URL%/}/health" || true)
          echo "HTTP $code"; cat health.json || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::SmartBank API health check failed (HTTP $code). The database may be stopped; start it in the OCI console."
            exit 1
          fi
