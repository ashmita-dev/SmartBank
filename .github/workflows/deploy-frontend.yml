# Tests the project on every push and pull request, and publishes the React
# frontend to GitHub Pages from main, in one of two clearly separated modes:
#
#   REAL ORACLE MODE  when the repository VARIABLE SMARTBANK_API_URL (public,
#                     not a secret) points at a hosted SmartBank ORDS API and
#                     its /health endpoint answers. Transactions go to Oracle.
#   DEMO MODE         otherwise. The site runs an in-browser simulation that is
#                     labelled as simulated on every page; nothing reaches Oracle.
#
# A manual run may pass api_base_url to override the variable.
#
# Nothing secret is used here: database and demo passwords live only in the
# Oracle database, and every VITE_ value ends up in public JavaScript.
name: Deploy frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public HTTPS URL of the SmartBank ORDS API (…/ords/sb/api). Empty = use the SMARTBANK_API_URL variable."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Cloud install script matches database/ sources
        run: node ../scripts/build-cloud-install.mjs --check
      - name: Demo-mode seed data matches database/03_seed_data.sql
        run: node ../scripts/build-demo-data.mjs --check

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.url.outputs.deploy }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve and validate the API URL
        id: url
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.SMARTBANK_API_URL }}
        run: |
          API_URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$API_URL" ]; then
            echo "::notice::No hosted Oracle API configured (SMARTBANK_API_URL): publishing DEMO MODE (simulated, labelled)."
            echo "mode=demo" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::The API URL must start with https://"; exit 1 ;;
          esac
          if echo "$API_URL" | grep -Eiq '://(localhost|127\.|0\.0\.0\.0|\[::1\]|10\.|192\.168\.)|trycloudflare\.com'; then
            echo "::error::The API URL points at a private address or a temporary tunnel."; exit 1
          fi
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"
          echo "mode=oracle" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Check the API is reachable before publishing
        if: steps.url.outputs.mode == 'oracle'
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' --max-time 30 "${{ steps.url.outputs.api_url }}/health" || true)
          echo "GET /health -> HTTP $code"; cat health.json || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::The API health check failed; not publishing a site that cannot reach its backend."; exit 1
          fi

      - if: steps.url.outputs.deploy == 'true'
        run: npm ci
      - if: steps.url.outputs.deploy == 'true'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ steps.url.outputs.api_url }}
          VITE_DEMO_MODE: ${{ steps.url.outputs.mode == 'demo' && 'true' || 'false' }}

      - name: Check bundle for secrets and stale tunnel URLs
        if: steps.url.outputs.deploy == 'true'
        run: |
          if grep -Rq 'trycloudflare\.com' dist; then
            echo "::error::The bundle points at a temporary tunnel address"; exit 1
          fi
          if grep -RiqE 'db\.password|ORDS_PUBLIC_USER|SMARTBANK_USER/|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|"password":"[^"]' dist; then
            echo "::error::Possible credential in the build output"; exit 1
          fi

      # Single-page app on a static host: give every app route its own copy of
      # index.html so direct links and refreshes return HTTP 200, and keep
      # 404.html as the fallback for any other path.
      - if: steps.url.outputs.deploy == 'true'
        run: |
          for route in login user user/accounts user/transactions user/transfer user/settings \
                       admin admin/transactions admin/alerts admin/analysts admin/settings; do
            mkdir -p "dist/$route" && cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
      - if: steps.url.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
