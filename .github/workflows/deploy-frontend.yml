# Builds the React frontend and publishes it to GitHub Pages.
#
# Manual only (Actions tab -> "Deploy frontend" -> Run workflow), and it
# requires Pages to be enabled once: Settings -> Pages -> Source: GitHub Actions.
#
# The hosted page is a static frontend only. It calls the API at
# VITE_API_BASE_URL (default http://localhost:8080/...), so it shows
# "API offline" unless the visitor runs Oracle + ORDS locally. Never point it
# at a public, unauthenticated ORDS endpoint.
name: Deploy frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Single-page app: serve index.html for deep links such as /SmartBank/admin.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
