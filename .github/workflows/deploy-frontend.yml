# Builds the React frontend and publishes it to GitHub Pages.
#
# Manual only (Actions tab -> "Deploy frontend" -> Run workflow, or
# `gh workflow run deploy-frontend.yml -f api_base_url=https://...`).
# Pages must be enabled once: Settings -> Pages -> Source: GitHub Actions.
#
# api_base_url must be the public HTTPS address of the READ-ONLY gateway
# (gateway/server.mjs behind a tunnel), never ORDS itself: the ORDS module has
# no authentication. Left empty, the site is published with no backend and
# says so on every page. localhost and plain-http URLs are rejected.
name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public HTTPS URL of the read-only gateway (e.g. https://example.trycloudflare.com/api). Empty = no backend."
        required: false
        default: ""
      read_only:
        description: "Build in read-only mode (disables transfer and alert-status actions)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate API URL
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::No api_base_url given: the site will state that no backend is configured."
            exit 0
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::api_base_url must start with https://"; exit 1 ;;
          esac
          if echo "$API_URL" | grep -Eiq '://(localhost|127\.|0\.0\.0\.0|\[::1\]|10\.|192\.168\.)'; then
            echo "::error::api_base_url points at a private address; visitors cannot reach it."; exit 1
          fi
          if echo "$API_URL" | grep -q ':8080'; then
            echo "::error::Port 8080 is ORDS. Publish the read-only gateway instead."; exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
          VITE_READ_ONLY: ${{ inputs.read_only && 'true' || 'false' }}

      - name: Check bundle for secrets
        run: |
          if grep -RiqE 'db\.password|ORDS_PUBLIC_USER|SMARTBANK_USER/|BEGIN (RSA|OPENSSH) PRIVATE KEY' dist; then
            echo "::error::Possible credential in the build output"; exit 1
          fi

      # Single-page app: serve index.html for deep links such as /SmartBank/admin.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
